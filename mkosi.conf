[Distribution]
Distribution=arch
Mirror=https://archive.archlinux.org/repos/2026/10/20
Architecture=x86-64
Repositories=core,extra,multilib

[Output]
Format=disk
ImageId=avenoros
ImageVersion=0.3.2
SplitArtifacts=uki,partitions
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache

[Build]
WithNetwork=yes

[Validation]
SecureBoot=yes
SecureBootKey=mkosi.key
SecureBootCertificate=mkosi.crt
SignExpectedPcr=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=console=ttyS0 quiet loglevel=3 rw amd_pstate=active nvidia-drm.modeset=1
Hostname=avenor
Locale=en_US.UTF-8
Timezone=America/Vancouver
Autologin=yes
WithDocs=no
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
Packages=
        base
        linux
        linux-firmware-amdgpu
        linux-firmware-cirrus
        linux-firmware-intel
        linux-firmware-mediatek
        linux-firmware-marvell
        linux-firmware-nvidia
        linux-firmware-realtek
        linux-firmware-ti
        sof-firmware
        linux-firmware-atheros
        linux-firmware-broadcom
        wireless-regdb
        wpa_supplicant
        systemd
        btrfs-progs
        erofs-utils
        cryptsetup
        openssl
        jq
        sudo
        networkmanager
        qemu-guest-agent
        sddm
        plasma-desktop
        kwin
        pipewire
        wireplumber
        mesa
        noto-fonts
        inter-font
        plasma-nm
        bluez
        bluez-utils
        bluedevil
        dolphin
        chromium
        konsole
        kvantum
        scx-scheds
        gamemode
        lib32-gamemode
        zram-generator
        nvidia-open
        nvidia-utils
        lib32-nvidia-utils
        nvidia-prime
        vulkan-radeon
        lib32-vulkan-radeon
        lib32-mesa
        vulkan-icd-loader
        lib32-vulkan-icd-loader
        steam
        mangohud
        lib32-mangohud
        sdl2-compat
BuildPackages=
        base-devel
        cmake
        curl
        shaderc
        vulkan-headers
        sdl2-compat
        pipewire
        vulkan-icd-loader
