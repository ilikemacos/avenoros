[Distribution]
Distribution=arch
Mirror=https://archive.archlinux.org/repos/2026/10/20
Architecture=x86-64

[Output]
Format=disk
ImageId=avenoros
ImageVersion=0.1.0
SplitArtifacts=uki,partitions
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache

[Validation]
SecureBoot=yes
SecureBootKey=mkosi.key
SecureBootCertificate=mkosi.crt
SignExpectedPcr=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=console=ttyS0 quiet loglevel=3 rw
Hostname=avenor
Locale=en_US.UTF-8
Timezone=UTC
Autologin=yes
WithDocs=no
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
Packages=
        base
        linux
        linux-firmware-intel
        systemd
        btrfs-progs
        erofs-utils
        cryptsetup
        openssl
        jq
        sudo
        networkmanager
        qemu-guest-agent
        sddm
        plasma-desktop
        kwin
        pipewire
        wireplumber
        mesa
        noto-fonts
