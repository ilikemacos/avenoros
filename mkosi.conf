[Distribution]
Distribution=arch
Mirror=https://archive.archlinux.org/repos/2026/10/20
Architecture=x86-64

[Output]
Format=disk
ImageId=avenoros
ImageVersion=0.3.1
SplitArtifacts=uki,partitions
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache

[Validation]
SecureBoot=yes
SecureBootKey=mkosi.key
SecureBootCertificate=mkosi.crt
SignExpectedPcr=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=console=ttyS0 quiet loglevel=3 rw
Hostname=avenor
Locale=en_US.UTF-8
Timezone=America/Vancouver
Autologin=yes
WithDocs=no
KernelModulesInitrdExclude=.*
RemoveFiles=/usr/lib/firmware/bnx2 /usr/lib/firmware/bnx2x /usr/lib/firmware/intel/qat /usr/lib/firmware/mediatek/mt7996
KernelModulesInitrdInclude=default
Packages=
        base
        linux
        linux-firmware-amdgpu
        linux-firmware-cirrus
        linux-firmware-intel
        linux-firmware-mediatek
        linux-firmware-nvidia
        linux-firmware-realtek
        sof-firmware
        linux-firmware-atheros
        linux-firmware-broadcom
        wireless-regdb
        wpa_supplicant
        systemd
        btrfs-progs
        erofs-utils
        cryptsetup
        openssl
        jq
        sudo
        networkmanager
        qemu-guest-agent
        sddm
        plasma-desktop
        kwin
        pipewire
        wireplumber
        mesa
        noto-fonts
        inter-font
        plasma-nm
        bluez
        bluez-utils
        bluedevil
        dolphin
        chromium
        konsole
        kvantum
